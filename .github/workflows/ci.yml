name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Syntax check (py_compile)
        run: |
          python -m py_compile \
            execute_all_scripts.py \
            data_extract_to_json.py \
            audit_extract_helper.py \
            audit_parse_detector.py \
            generate_status_log.py \
            audit_utils/__init__.py
      - name: Import smoke
        run: |
          python -c "import audit_utils; import data_extract_to_json; import audit_extract_helper; import audit_parse_detector; import generate_status_log"
      - name: Parser smoke test
        run: python -m unittest tests.test_audit_parse_smoke -v
