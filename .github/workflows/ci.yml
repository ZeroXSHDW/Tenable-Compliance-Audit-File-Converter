name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tenable-converter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -l --progress-spinner off
      - name: Syntax check (py_compile)
        run: |
          python -m py_compile \
            execute_all_scripts.py \
            data_extract_to_json.py \
            audit_extract_helper.py \
            audit_parse_detector.py \
            generate_status_log.py \
            audit_utils/__init__.py
      - name: Import smoke
        run: |
          python -c "import audit_utils; import data_extract_to_json; import audit_extract_helper; import audit_parse_detector; import generate_status_log"
      - name: Parser smoke test
        run: python -m unittest tests.test_audit_parse_smoke -v
